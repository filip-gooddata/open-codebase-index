name: Fork CI (Linux)

# Full validation gate on Linux for the fork. Runs without secrets; pull
# requests from other forks get a read-only token.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          key: fork-ci-linux-x64

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (Vitest)
        run: npm run test:run

      - name: Test (cargo)
        working-directory: native
        run: cargo test --release

  local-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Local wrapper tests
        env:
          OCBI_WRAPPER_REQUIRE_SHELLCHECK: '1'
        run: |
          if [ -f contrib/local-wrapper/test/run-tests.sh ]; then
            bash contrib/local-wrapper/test/run-tests.sh
          else
            echo "contrib/local-wrapper/test/run-tests.sh not present; skipping"
          fi
